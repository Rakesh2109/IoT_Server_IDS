apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: false
    editable: true
    jsonData:
      version: Flux
      organization: iot-ids
      defaultBucket: iot-data
      tlsSkipVerify: true
    secureJsonData:
      token: iot-ids-admin-token-change-in-production

